name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m compileall -q pipeline scripts

      - name: Compile C++ builder stage
        run: docker buildx build --platform linux/amd64 --target builder .

  test:
    name: Build and fixture tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture test dependencies
        run: python -m pip install polars

      - name: Build amd64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t shopping-sessions:ci \
            .

      - name: Run all fixtures
        env:
          IMAGE: shopping-sessions:ci
          CPUS: "8"
          MEM: 24g
          PLATFORM: linux/amd64
        run: python scripts/run_fixtures.py fixtures -- scripts/docker_run.sh

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"